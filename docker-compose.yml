services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: orderflow-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m

  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql

  order-service:
    build: ./order-service
    ports: ["8081:8081"]
    environment: &env
      DB_HOST: postgres
      KAFKA: kafka:19092
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on: [kafka, postgres]
    restart: on-failure

  inventory-service:
    build: ./inventory-service
    ports: ["8082:8082"]
    environment: *env
    depends_on: [kafka, postgres]
    restart: on-failure

  payment-service:
    build: ./payment-service
    ports: ["8083:8083"]
    environment: *env
    depends_on: [kafka, postgres]
    restart: on-failure
